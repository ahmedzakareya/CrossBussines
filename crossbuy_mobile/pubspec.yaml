name: crossbuy_mobile
description: "CrossBuy ERP mobile app (Android & iOS) — Arabic/English."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  signalr_netcore: ^1.3.7
  fl_chart: ^0.69.0
  # the owner's reference design draws with Lucide (stroke 1.5); pinned to a release at least two weeks old
  lucide_icons_flutter: 4.0.1
  # H176 internal calls: WebRTC (same protocol as the browser) and the recording player; pinned, both 2+ weeks old
  flutter_webrtc: 1.6.3
  video_player: 2.14.1
  # the rep's customer card: "call" opens the dialer, "location" opens the maps app; pinned, 2+ weeks old
  url_launcher: 6.3.1
  # punching attendance from the phone: the position the server measures against the branch office; pinned, 2+ weeks old
  geolocator: 13.0.2
  # Communication v2: the chat sends a file or a picture, and records a voice message; pinned, both 2+ weeks old
  file_picker: 13.3.2
  record: 7.1.2
  # push with the app closed (owner 2026-11-22: FCM wakes the app with no content; the app fetches and shows the notice itself); pinned, 2+ weeks old
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_local_notifications: 22.3.3
  # a video message recorded in the app (camera + microphone into MP4); flutter_webrtc's file recorder takes its
  # sound from a live call's audio engine only, so outside a call it wrote empty files. Pinned, 2+ weeks old
  camera: 0.12.2

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/   # H176: the ring and the ringback, two plain tones made for this app
    - assets/brand/    # the sign-in: the brand login scene and the white CrossBusiness logo

  # Cairo, the system's Arabic face (the same files the web uses: wwwroot/Backend-assets/fonts/cairo)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
