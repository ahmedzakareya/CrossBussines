name: crossbuy_mobile
description: "CrossBuy ERP mobile app (Android & iOS) — Arabic/English."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  signalr_netcore: ^1.3.7
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Cairo, the system's Arabic face (the same files the web uses: wwwroot/Backend-assets/fonts/cairo)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
