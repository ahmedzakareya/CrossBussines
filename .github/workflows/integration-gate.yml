# =============================================================================================
# R1 - integration gate CI.
#
# Runs on every pull request into the protected integration branch. A merge is accepted only when
# this workflow is green.
#
#     No tab may leave the shared integration branch unbuildable.
#
# The gate is the SAME script a tab runs locally (governance/tools/integration-gate.ps1), so CI
# cannot drift from what developers check. A CI-only copy of the rules would be a second
# implementation of one concept - the exact defect the two deploy/sql trees demonstrate.
#
# TAB ATTRIBUTION: the branch name carries the tab id (tab/tab-1-..., tab/tab-2-...), which is how
# the ownership check knows whose paths to allow. A branch that does not follow the convention
# fails fast with a clear message rather than being silently checked against the wrong tab.
# =============================================================================================
name: Integration Gate

on:
  pull_request:
    branches: [integration]
  workflow_dispatch:
    inputs:
      tabId:
        description: 'Registered owner for this reviewed change'
        type: choice
        required: true
        options: [TAB-1, TAB-2, TAB-3, TAB-4, TAB-5, TAB-6]
      baseCommit:
        description: 'Full base commit SHA for the ownership diff'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Integration gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out (full history - the gate diffs against the base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Aggregate pushes cannot be assigned to one tab. PR checks are the merge gate.
      - name: Resolve registered owner and exact comparison base
        id: tab
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          REQUESTED_TAB: ${{ inputs.tabId }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE: ${{ inputs.baseCommit }}
        run: |
          $tab = ./governance/tools/resolve-ci-tab.ps1 -Branch $env:SOURCE_BRANCH -RequestedTab $env:REQUESTED_TAB -EventName $env:EVENT_NAME
          $base = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE } else { $env:MANUAL_BASE }
          if ($base -notmatch '^[0-9a-fA-F]{40}$') { throw 'An exact 40-character base commit SHA is required.' }
          git cat-file -e "$base^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Comparison base is not available in this checkout.' }
          "tabId=$tab" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ---- registries must be current before anything is checked against them -----------------
      - name: Set up Python (registry generator)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SQL quarantine refusal controls (no database)
        shell: pwsh
        run: |
          python governance/tests/sql_quarantine_policy_tests.py
          exit $LASTEXITCODE

      - name: CI owner attribution refusal controls
        shell: pwsh
        run: |
          python governance/tests/ci_tab_attribution_tests.py
          exit $LASTEXITCODE

      - name: Both test project summaries are required
        shell: pwsh
        run: |
          ./governance/tests/test-suite-summary-tests.ps1
          exit $LASTEXITCODE

      - name: Registries are regenerated and unchanged
        shell: pwsh
        run: |
          python docs/roadmap-v2/_generator/generate_roadmap_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'Registry generation failed.' }
          $diff = git status --porcelain governance/registry docs/roadmap-v2
          if ($diff) {
            Write-Host "::error::Generated registries are stale. Re-run the generator and commit."
            $diff | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "registries current"

      # ---- SQL governance: authored side, no database needed ----------------------------------
      - name: SQL governance
        shell: pwsh
        run: |
          ./governance/tools/validate-sql-governance.ps1
          $code = $LASTEXITCODE
          if ($code -eq 2) { Write-Host "::error::A script in the tree must not be deployed." }
          if ($code -eq 4) { Write-Host "::error::manifest.json is stale - re-run scan-sql-manifest.ps1." }
          exit $code

      - name: Immutable bootstrap refusal controls
        shell: pwsh
        run: |
          python governance/tests/r1-bootstrap-tests.py
          exit $LASTEXITCODE

      # ---- ownership --------------------------------------------------------------------------
      - name: File ownership
        shell: pwsh
        env:
          R1_SOURCE_BRANCH: ${{ github.head_ref }}
          R1_ACTOR: ${{ github.actor }}
          R1_REPOSITORY_OWNER: ${{ github.repository_owner }}
          R1_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          R1_TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          $base = "${{ steps.tab.outputs.base }}"
          if ($env:R1_SOURCE_BRANCH -eq 'tab/tab-1-r1-qualified-20261013' -and $base -eq '480c3d49f7b862b0662af161db824360e80ff5df') {
            ./governance/tools/check-r1-bootstrap.ps1 -Base $base -Branch $env:R1_SOURCE_BRANCH -Actor $env:R1_ACTOR -RepositoryOwner $env:R1_REPOSITORY_OWNER -SourceRepository $env:R1_SOURCE_REPOSITORY -TargetRepository $env:R1_TARGET_REPOSITORY
          } else {
            ./governance/tools/check-file-ownership.ps1 -TabId ${{ steps.tab.outputs.tabId }} -Base $base
          }
          exit $LASTEXITCODE

      # ---- the full gate ----------------------------------------------------------------------
      # -RequireAll so a check that could not run fails CI. A quiet skip in CI is how a gate
      # stops meaning anything, and no coverage is ever claimed from a skip.
      - name: Integration gate (12 checks)
        shell: pwsh
        env:
          R1_SOURCE_BRANCH: ${{ github.head_ref }}
          R1_ACTOR: ${{ github.actor }}
          R1_REPOSITORY_OWNER: ${{ github.repository_owner }}
          R1_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          R1_TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          $base = "${{ steps.tab.outputs.base }}"
          $bootstrap = @{}
          if ($env:R1_SOURCE_BRANCH -eq 'tab/tab-1-r1-qualified-20261013' -and $base -eq '480c3d49f7b862b0662af161db824360e80ff5df') { $bootstrap.R1Bootstrap = $true }
          ./governance/tools/integration-gate.ps1 -TabId ${{ steps.tab.outputs.tabId }} -Base $base -RequireAll @bootstrap
          exit $LASTEXITCODE

      - name: Gate summary
        if: always()
        shell: pwsh
        run: |
          "## Integration gate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Tab: ``${{ steps.tab.outputs.tabId }}``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Result: ``${{ job.status }}``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "No tab may leave the shared integration branch unbuildable." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
