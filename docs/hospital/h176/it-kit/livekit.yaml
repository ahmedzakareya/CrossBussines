# LiveKit — the hospital's internal media server for group calls above four people (H176). Replace every <<...>>.
# Each person sends their picture and voice once to this server, which passes them to the others (up to twelve).
# CrossBuy keeps the API secret and hands each person a room token for ONE call (6 hours); rooms are "hcall-<company>-<call>".

port: 7880                      # signalling (HTTP/WebSocket) — put nginx-livekit.conf in front for wss://
bind_addresses:
  - <<THIS SERVER'S INTERNAL IP, e.g. 10.0.5.30>>
log_level: info

rtc:
  tcp_port: 7881                # media over TCP when UDP is blocked
  port_range_start: 50000       # media over UDP
  port_range_end: 60000
  use_external_ip: false        # inside the hospital: never look up a public address
  node_ip: <<SAME INTERNAL IP>>
  # devices that cannot reach this server directly use the hospital's coturn (same secret as CrossBuy's settings)
  # turn_servers:
  #   - host: <<turn.hospital.local>>
  #     port: 3478
  #     protocol: udp
  #     secret: <<the coturn static-auth-secret>>

keys:
  # API key: API secret — the same pair goes in CrossBuy → Call settings → "The internal media server"
  <<hospital-calls>>: <<A LONG RANDOM SECRET, 32+ characters>>

room:
  empty_timeout: 60             # a room nobody is in closes after a minute
  max_participants: 12          # CrossBuy's own cap is twelve as well

turn:
  enabled: false                # coturn does this job

webhook: {}                     # not used: CrossBuy's own hub knows who is in each call
