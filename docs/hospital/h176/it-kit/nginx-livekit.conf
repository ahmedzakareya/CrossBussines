# nginx in front of LiveKit: wss://livekit.hospital.local (a page served over https may only open wss://).
# The certificate comes from the hospital's internal CA, the same one every device already trusts.
server {
    listen 443 ssl http2;
    server_name <<livekit.hospital.local>>;

    ssl_certificate     /etc/ssl/hospital/livekit.crt;
    ssl_certificate_key /etc/ssl/hospital/livekit.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # only the hospital's networks
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;     # a room's WebSocket stays open for the whole call
        proxy_send_timeout 86400s;
    }
}
