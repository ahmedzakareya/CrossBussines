# coturn — the hospital's internal relay for calls (H176). Replace every <<...>> before starting.
# Calls go device to device; this relay is used only when two devices cannot reach each other directly
# (different VLANs, a firewall between departments). It relays ONLY to addresses inside the hospital.

# ---- where it listens
listening-port=3478
tls-listening-port=5349
listening-ip=<<THIS SERVER'S INTERNAL IP, e.g. 10.0.5.20>>
relay-ip=<<SAME IP>>
# the relay ports (open them on this server's firewall, UDP)
min-port=49152
max-port=65535

# ---- credentials: a short-lived password per person, made by CrossBuy (HMAC-SHA1 of "<expiry>:<employee id>")
# The same secret goes in CrossBuy → Call settings → "The shared secret". It never reaches a browser.
use-auth-secret
static-auth-secret=<<A LONG RANDOM STRING — openssl rand -hex 32>>
realm=<<hospital.local>>
fingerprint

# ---- TLS (turns:) with the internal certificate (the same CA the browsers trust)
cert=/etc/ssl/hospital/turn.crt
pkey=/etc/ssl/hospital/turn.key
no-tlsv1
no-tlsv1_1

# ---- inside the hospital only: relay to private addresses, nothing else
# allowed-peer-ip takes priority over denied-peer-ip
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
no-multicast-peers
no-loopback-peers

# ---- hardening
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
total-quota=300
user-quota=12
stale-nonce=600
log-file=/var/log/turnserver/turn.log
simple-log
