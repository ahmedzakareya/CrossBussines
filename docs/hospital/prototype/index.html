<!DOCTYPE html>
<!--
  CrossBusiness — Hospital Management prototype (static, no backend).
  Shell copied from Views/Shared/_LayoutInventory.cshtml (Metronic 8.2.3) with the house layer
  crossbuy-brand.css on top. Language is chosen before the first paint so the right-direction bundle
  is the only one loaded — loading both is what makes a page render LTR and RTL at once.
-->
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>CrossBusiness Hospital</title>
	<link rel="shortcut icon" href="brand/crossbusiness-favicon.ico" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" />
	<script>
		(function () {
			var lang = 'ar';
			try { lang = localStorage.getItem('hms.lang') || 'ar'; } catch (e) { }
			if (lang !== 'en') lang = 'ar';
			var rtl = lang === 'ar';
			document.documentElement.setAttribute('lang', lang);
			document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
			document.documentElement.setAttribute('data-bs-theme', 'light');
			var sfx = rtl ? '.rtl' : '';
			document.write(
				'<link href="assets/plugins/global/plugins.bundle' + sfx + '.css" rel="stylesheet" />' +
				'<link href="assets/css/style.bundle' + sfx + '.css" rel="stylesheet" />' +
				'<link href="assets/css/crossbuy-brand.css" rel="stylesheet" />' +
				'<link href="app/hms.css?v=r4" rel="stylesheet" />');
			window.HMS_LANG = lang;
		})();
	</script>
</head>
<body id="kt_app_body" data-kt-app-header-fixed="true" data-kt-app-header-fixed-mobile="true" data-kt-app-sidebar-enabled="true" data-kt-app-sidebar-fixed="true" data-kt-app-sidebar-hoverable="true" data-kt-app-sidebar-push-toolbar="true" data-kt-app-sidebar-push-footer="true" class="app-default">
	<div class="d-flex flex-column flex-root app-root" id="kt_app_root">
		<div class="app-page flex-column flex-column-fluid" id="kt_app_page">
			<!--begin::Header-->
			<div id="kt_app_header" class="app-header d-flex flex-column flex-stack">
				<div class="d-flex flex-stack flex-grow-1">
					<div class="app-header-logo d-flex align-items-center ps-lg-12" id="kt_app_header_logo">
						<div id="kt_app_sidebar_toggle" class="app-sidebar-toggle btn btn-sm btn-icon bg-body btn-color-gray-500 btn-active-color-primary w-30px h-30px ms-n2 me-4 d-none d-lg-flex" data-kt-toggle="true" data-kt-toggle-state="active" data-kt-toggle-target="body" data-kt-toggle-name="app-sidebar-minimize">
							<i class="ki-outline ki-abstract-14 fs-3 mt-1"></i>
						</div>
						<div class="btn btn-icon btn-active-color-primary w-35px h-35px ms-3 me-2 d-flex d-lg-none" id="kt_app_sidebar_mobile_toggle">
							<i class="ki-outline ki-abstract-14 fs-2"></i>
						</div>
						<a href="#/dashboard" class="app-sidebar-logo">
							<img alt="CrossBusiness" src="brand/crossbusiness-logo-horizontal-light.svg" class="h-28px" />
						</a>
					</div>
					<div class="app-navbar flex-grow-1 justify-content-end" id="kt_app_header_navbar">
						<div class="app-navbar-item d-flex align-items-stretch flex-lg-grow-1">
							<div class="header-search d-flex align-items-center w-lg-350px">
								<form class="d-none d-lg-block w-100 position-relative" autocomplete="off" onsubmit="return HMS.globalSearch(event)">
									<i class="ki-outline ki-magnifier search-icon fs-2 text-gray-500 position-absolute top-50 translate-middle-y ms-5"></i>
									<input type="text" id="hms_search" class="search-input form-control border h-lg-45px ps-13" />
								</form>
							</div>
						</div>
						<div class="app-navbar-item ms-2 ms-lg-6 d-none d-md-flex" id="hms_facility_chip"></div>
						<div class="app-navbar-item ms-2 ms-lg-6">
							<button type="button" class="btn btn-sm btn-light-primary fw-bold" id="hms_lang_toggle" onclick="HMS.toggleLang()"></button>
						</div>
						<div class="app-navbar-item ms-2 ms-lg-6 me-lg-6" id="hms_user"></div>
					</div>
				</div>
				<div class="app-header-separator"></div>
			</div>
			<!--end::Header-->
			<div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
				<!--begin::Sidebar-->
				<div id="kt_app_sidebar" class="app-sidebar flex-column" data-kt-drawer="true" data-kt-drawer-name="app-sidebar" data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-overlay="true" data-kt-drawer-width="250px" data-kt-drawer-direction="start" data-kt-drawer-toggle="#kt_app_sidebar_mobile_toggle">
					<div id="kt_app_sidebar_wrapper" class="app-sidebar-wrapper">
						<div class="hover-scroll-y my-5 my-lg-2 mx-4" data-kt-scroll="true" data-kt-scroll-activate="{default: false, lg: true}" data-kt-scroll-height="auto" data-kt-scroll-dependencies="#kt_app_header" data-kt-scroll-wrappers="#kt_app_sidebar_wrapper" data-kt-scroll-offset="5px">
							<div id="hms_menu" data-kt-menu="true" data-kt-menu-expand="false" class="app-sidebar-menu-primary menu menu-column menu-rounded menu-sub-indention menu-state-bullet-primary px-3 mb-5"></div>
						</div>
					</div>
				</div>
				<!--end::Sidebar-->
				<div class="app-main flex-column flex-row-fluid" id="kt_app_main">
					<div class="d-flex flex-column flex-column-fluid">
						<div id="kt_app_toolbar" class="app-toolbar pt-6 pb-2"></div>
						<div id="kt_app_content" class="app-content flex-column-fluid">
							<div class="app-container container-fluid" id="hms_content"></div>
						</div>
					</div>
					<div id="kt_app_footer" class="app-footer">
						<div class="app-container container-fluid d-flex flex-column flex-md-row flex-center flex-md-stack py-3">
							<div class="text-gray-900 order-2 order-md-1">
								<span class="text-gray-700 fw-semibold me-1">2026&copy;</span>
								<span class="text-gray-800 fw-semibold">CrossBusiness Platform</span>
							</div>
							<div class="text-gray-600 fs-7 order-1 order-md-2" id="hms_proto_note"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- One shared modal; screens fill it through HMS.modal(). -->
	<div class="modal fade" id="hms_modal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered mw-750px">
			<div class="modal-content">
				<div class="modal-header">
					<h2 class="fw-bold m-0" id="hms_modal_title"></h2>
					<div class="btn btn-icon btn-sm btn-active-icon-primary" data-bs-dismiss="modal"><i class="ki-outline ki-cross fs-1"></i></div>
				</div>
				<div class="modal-body py-8 px-lg-10" id="hms_modal_body"></div>
				<div class="modal-footer flex-center" id="hms_modal_footer"></div>
			</div>
		</div>
	</div>

	<div id="kt_scrolltop" class="scrolltop" data-kt-scrolltop="true"><i class="ki-outline ki-arrow-up"></i></div>

	<script>var hostUrl = "assets/";</script>
	<script src="assets/plugins/global/plugins.bundle.js"></script>
	<script src="assets/js/scripts.bundle.js"></script>
	<script src="app/core.js?v=r4"></script>
	<script src="app/data.js?v=r4"></script>
	<script src="app/screens-front.js?v=r4"></script>
	<script src="app/screens-clinical.js?v=r4"></script>
	<script src="app/screens-diagnostics.js?v=r4"></script>
	<script src="app/screens-finance.js?v=r4"></script>
	<script src="app/screens-extra.js?v=r4"></script>
	<script src="app/screens-rooms.js?v=r4"></script>
	<script src="app/screens-designer.js?v=r4"></script>
	<script src="app/boot.js?v=r4"></script>
</body>
</html>
