<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>محادثة · CrossBusiness</title>
<style>
	/* A guest from outside the company (owner 2026-11-22): this page, one conversation, nothing else of the system. */
	/* the product's own Cairo, served by this server: a guest's browser contacts no one else */
	@font-face { font-family: Cairo; src: url('/Backend-assets/fonts/cairo/Cairo-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
	@font-face { font-family: Cairo; src: url('/Backend-assets/fonts/cairo/Cairo-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
	@font-face { font-family: Cairo; src: url('/Backend-assets/fonts/cairo/Cairo-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
	:root { --brand: #1F2D4D; --brand2: #3A5795; --soft: #EEF2FA; --line: #E4E8F0; --ink: #1F2D4D; --muted: #738098; --bg: #F5F7FB; --red: #C0392B; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body { font-family: Cairo, system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
	header { background: var(--brand); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
	header .t { font-weight: 700; font-size: 16px; } header .s { font-size: 12px; opacity: .75; }
	header .badge { margin-inline-start: auto; font-size: 11px; background: rgba(255,255,255,.12); padding: 3px 10px; border-radius: 20px; }
	main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
	.msg { max-width: min(560px, 85%); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; align-self: flex-start; }
	.msg.mine { align-self: flex-end; background: var(--brand2); color: #fff; border-color: var(--brand2); }
	.msg .n { font-size: 11.5px; font-weight: 700; color: var(--brand2); margin-bottom: 2px; } .msg.mine .n { color: #DCE5F8; }
	.msg .n .g { font-weight: 600; font-size: 10px; background: var(--soft); color: var(--brand2); border-radius: 6px; padding: 0 6px; margin-inline-start: 6px; }
	.msg .x { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; unicode-bidi: plaintext; }
	.msg .w { font-size: 10.5px; opacity: .6; margin-top: 2px; direction: ltr; text-align: end; }
	.msg .f { font-size: 12.5px; color: var(--muted); } .msg.mine .f { color: #DCE5F8; }
	.empty { margin: auto; color: var(--muted); text-align: center; font-size: 14px; }
	footer { background: #fff; border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; }
	textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; min-height: 44px; max-height: 140px; background: var(--bg); color: var(--ink); }
	textarea:focus-visible, button:focus-visible { outline: 2px solid var(--brand2); outline-offset: 2px; }
	button { border: 0; border-radius: 12px; background: var(--brand2); color: #fff; font: inherit; font-weight: 600; padding: 0 18px; cursor: pointer; }
	button[disabled] { opacity: .5; cursor: default; }
	.gone { margin: auto; max-width: 420px; text-align: center; padding: 24px; }
	.gone h1 { font-size: 18px; margin: 0 0 8px; } .gone p { color: var(--muted); font-size: 14px; margin: 0; }
	/* a group call of the conversation: the bar that offers it, and the call */
	.callbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--brand2); }
	.callbar[hidden] { display: none; }
	.callbar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px rgba(192,57,43,.15); }
	.callbar button { margin-inline-start: auto; padding: 7px 18px; }
	#stage { position: fixed; inset: 0; background: #0C1837; z-index: 10; display: flex; flex-direction: column; }
	#stage[hidden] { display: none; }
	#tiles { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 14px; align-content: center; }
	.tile { position: relative; background: #17213A; border-radius: 16px; aspect-ratio: 4 / 3; overflow: hidden; display: grid; place-items: center; }
	.tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
	.tile.vid video { opacity: 1; } .tile.vid .face { visibility: hidden; }
	.tile .face { width: 86px; height: 86px; border-radius: 50%; background: var(--brand2); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; }
	.tile .nm { position: absolute; inset-inline-start: 10px; bottom: 10px; background: rgba(12,24,55,.75); color: #fff; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
	.tile.muted .nm::after { content: ' · صامت'; opacity: .75; }
	#mine { position: absolute; inset-inline-end: 16px; bottom: 86px; width: 150px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); transform: scaleX(-1); background: #000; }
	#mine[hidden] { display: none; }
	.ctl { display: flex; justify-content: center; gap: 10px; padding: 14px; background: rgba(12,24,55,.9); }
	.ctl button { padding: 10px 18px; background: rgba(255,255,255,.12); }
	.ctl button[hidden] { display: none; }
	.ctl button.off { background: rgba(255,255,255,.28); }
	.ctl button.leave { background: var(--red); }
	body.incall { overflow: hidden; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #0F1626; --line: #26324A; --ink: #E6ECF7; --muted: #9AA6BF; --soft: #1C2742; }
		.msg { background: #17213A; } footer { background: #131C31; } textarea { background: #0F1626; }
	}
</style>
</head>
<body>
<header>
	<div><div class="t" id="title">…</div><div class="s" id="sub"></div></div>
	<span class="badge" id="badge">ضيف</span>
</header>
<div class="callbar" id="callbar" hidden><span class="dot" aria-hidden="true"></span><span id="cbT"></span><button id="cbJoin" type="button">انضمام</button></div>
<div id="stage" hidden role="dialog" aria-label="المكالمة">
	<div id="tiles"></div>
	<video id="mine" autoplay playsinline muted hidden></video>
	<div class="ctl"><button id="cmMic" type="button">كتم الصوت</button><button id="cmCam" type="button">إيقاف الكاميرا</button><button id="cmLeave" class="leave" type="button">مغادرة</button></div>
</div>
<main id="list" role="log" aria-live="polite" aria-label="الرسائل"><div class="empty">…</div></main>
<footer id="composer" hidden>
	<textarea id="box" rows="1" maxlength="2000" placeholder="اكتب رسالة" aria-label="اكتب رسالة"></textarea>
	<button id="send" type="button">إرسال</button>
</footer>
<script>
(function () {
	'use strict';
	// the key is in the #fragment: it is never sent to a server in the address or in a referrer
	var key = decodeURIComponent((location.hash || '').slice(1));
	var list = document.getElementById('list'), box = document.getElementById('box'), btn = document.getElementById('send');
	var last = 0, seen = {}, timer = null, dead = false;
	function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
	function time(iso) { try { return new Date(iso).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
	function gone() {
		dead = true; clearTimeout(timer);
		document.getElementById('composer').hidden = true;
		list.innerHTML = '';
		var g = el('div', 'gone'); g.appendChild(el('h1', null, 'انتهت صلاحية هذا الرابط')); g.appendChild(el('p', null, 'الرابط غير صالح أو انتهت مدته أو أُلغي. اطلب من الشخص الذي دعاك رابطاً جديداً.'));
		list.appendChild(g); document.getElementById('title').textContent = 'محادثة';
	}
	function paint(m) {
		if (seen[m.id]) return; seen[m.id] = 1;
		var e = list.querySelector('.empty'); if (e) e.remove();
		var d = el('div', 'msg' + (m.mine ? ' mine' : ''));
		var n = el('div', 'n', m.mine ? 'أنت' : (m.from || '')); if (m.guest && !m.mine) n.appendChild(el('span', 'g', 'ضيف'));
		d.appendChild(n);
		if (m.deleted) d.appendChild(el('div', 'f', 'حُذفت هذه الرسالة'));
		else { if (m.text) d.appendChild(el('div', 'x', m.text)); if (m.file) d.appendChild(el('div', 'f', m.file + ' (مرفق لا يُعرض للضيوف)')); }
		d.appendChild(el('div', 'w', time(m.at)));
		list.appendChild(d);
	}
	function load() {
		if (dead) return;
		fetch('/api/guest/chat?since=' + last, { headers: { 'X-Guest': key }, credentials: 'omit', cache: 'no-store' }).then(function (r) {
			if (r.status === 404) { gone(); return null; }
			return r.ok ? r.json() : null;
		}).then(function (d) {
			if (!d) return;
			document.getElementById('title').textContent = d.conversation || 'محادثة';
			document.getElementById('sub').textContent = 'أنت ' + d.guest + ' · تنتهي الدعوة ' + new Date(d.expiresAt).toLocaleDateString('ar');
			document.getElementById('composer').hidden = false;
			showLive(d.call || null);
			var near = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
			(d.messages || []).forEach(function (m) { paint(m); last = Math.max(last, m.id); });
			if (!list.querySelector('.msg') && !list.querySelector('.empty')) list.appendChild(el('div', 'empty', 'لا رسائل بعد — ابدأ المحادثة'));
			else if (list.querySelector('.empty') && list.querySelector('.msg')) list.querySelector('.empty').remove();
			if (near) list.scrollTop = list.scrollHeight;
		}).catch(function () { }).then(function () { if (!dead) timer = setTimeout(load, 3000); });
	}
	function send() {
		var t = box.value.trim(); if (!t || dead) return;
		btn.disabled = true;
		var fd = new FormData(); fd.append('text', t);
		fetch('/api/guest/chat', { method: 'POST', headers: { 'X-Guest': key }, credentials: 'omit', body: fd }).then(function (r) {
			if (r.status === 404) { gone(); return; }
			if (r.status === 429) { alertLine('أرسلت رسائل كثيرة خلال دقيقة — انتظر قليلاً'); return; }
			if (!r.ok) { alertLine('لم تُرسَل الرسالة'); return; }
			box.value = ''; clearTimeout(timer); load();
		}).catch(function () { alertLine('لم تُرسَل الرسالة'); }).then(function () { btn.disabled = false; box.focus(); });
	}
	function alertLine(t) { var d = el('div', 'msg', null); d.appendChild(el('div', 'f', t)); list.appendChild(d); list.scrollTop = list.scrollHeight; }
	/* ---------------- a group call of this conversation (owner 2026-11-22): the guest joins from here ----------------
	   Device to device with each person in the call; the connection messages go through the server over plain requests
	   (api/guest/call/…), and this page asks every ~0.8 s what the others sent it. */
	var callBar = document.getElementById('callbar'), stage = document.getElementById('stage');
	var live = null, call = null;   // live: the call going on; call: me in it { id, me, local, peers, timer, mic, cam }
	function post(url, data) {
		var fd = new FormData(); Object.keys(data).forEach(function (k) { fd.append(k, data[k]); });
		return fetch(url, { method: 'POST', headers: { 'X-Guest': key }, credentials: 'omit', body: fd }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
	}
	function showLive(c) {
		live = c;
		if (call || !c) { callBar.hidden = true; return; }
		callBar.hidden = false;
		document.getElementById('cbT').textContent = (c.video ? 'مكالمة فيديو جماعية جارية الآن' : 'مكالمة صوتية جماعية جارية الآن') + ' · ' + c.people + ' مشارك';
	}
	function sig(to, o) { if (call) post('/api/guest/call/signal', { callId: call.id, to: to, payload: JSON.stringify(o) }); }
	function tile(p) {
		if (p.el) return p.el;
		var t = el('div', 'tile'); var v = document.createElement('video'); v.autoplay = true; v.playsInline = true;
		var face = el('div', 'face', (p.name || '?').trim().slice(0, 2)); var n = el('div', 'nm', p.name || '');
		t.appendChild(v); t.appendChild(face); t.appendChild(n); document.getElementById('tiles').appendChild(t);
		p.el = t; p.v = v; return t;
	}
	function paintTile(p) {
		tile(p);
		var hasVideo = p.stream && p.stream.getVideoTracks().some(function (x) { return x.readyState === 'live' && !x.muted; }) && p.cam !== false;
		p.el.classList.toggle('vid', !!hasVideo);
		p.el.classList.toggle('muted', p.mic === false);
	}
	function peer(id, name, offer) {
		if (call.peers[id]) return call.peers[id];
		var p = call.peers[id] = { id: id, name: name, cands: [], stream: new MediaStream() };
		var pc = p.pc = new RTCPeerConnection({ iceServers: call.ice });
		pc.onicecandidate = function (e) { if (e.candidate) sig(id, { t: 'cand', c: e.candidate }); };
		pc.ontrack = function (e) {
			if (p.stream.getTracks().indexOf(e.track) < 0) p.stream.addTrack(e.track);
			tile(p); p.v.srcObject = p.stream; p.v.play().catch(function () { });
			e.track.onmute = e.track.onunmute = function () { paintTile(p); };
			paintTile(p);
		};
		pc.onconnectionstatechange = function () { if (pc.connectionState === 'connected') sendState(); };
		tile(p); paintTile(p);
		if (offer) {
			var a = call.local.getAudioTracks()[0], v = call.local.getVideoTracks()[0];
			pc.addTransceiver(a || 'audio', { direction: 'sendrecv', streams: [call.local] });
			pc.addTransceiver(v || 'video', { direction: 'sendrecv', streams: [call.local] });
			pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).then(function () { sig(id, { t: 'offer', sdp: pc.localDescription, card: call.me }); }).catch(function () { });
		}
		return p;
	}
	function flush(p) { p.cands.splice(0).forEach(function (c) { p.pc.addIceCandidate(c).catch(function () { }); }); }
	function onSignal(fromId, payload) {
		var d; try { d = JSON.parse(payload); } catch (e) { return; }
		var p = call.peers[fromId];
		if (d.t === 'offer') {
			p = p || peer(fromId, d.card && d.card.name, false);
			p.pc.setRemoteDescription(d.sdp).then(function () {
				p.pc.getTransceivers().forEach(function (tx) {
					var k = tx.receiver.track && tx.receiver.track.kind; tx.direction = 'sendrecv';
					var tr = k === 'audio' ? call.local.getAudioTracks()[0] : call.local.getVideoTracks()[0]; if (tr) tx.sender.replaceTrack(tr);
				});
				return p.pc.createAnswer();
			}).then(function (a) { return p.pc.setLocalDescription(a); }).then(function () { sig(fromId, { t: 'answer', sdp: p.pc.localDescription }); flush(p); }).catch(function () { });
			return;
		}
		if (!p) return;
		if (d.t === 'answer') { p.pc.setRemoteDescription(d.sdp).then(function () { flush(p); }).catch(function () { }); return; }
		if (d.t === 'cand') { if (p.pc.remoteDescription) p.pc.addIceCandidate(d.c).catch(function () { }); else p.cands.push(d.c); return; }
		if (d.t === 'state') { p.mic = d.mic !== false; p.cam = !!(d.cam || d.share); paintTile(p); return; }
	}
	function drop(id) { var p = call && call.peers[id]; if (!p) return; try { p.pc.close(); } catch (e) { } if (p.el) p.el.remove(); delete call.peers[id]; }
	function sendState() { if (!call) return; Object.keys(call.peers).forEach(function (id) { sig(+id, { t: 'state', mic: call.mic, cam: call.cam, share: false }); }); }
	function poll() {
		if (!call) return;
		fetch('/api/guest/call/poll?callId=' + call.id, { headers: { 'X-Guest': key }, credentials: 'omit', cache: 'no-store' }).then(function (r) {
			if (r.status === 404) { endCall(); gone(); return null; }
			return r.ok ? r.json() : null;
		}).then(function (x) {
			if (!x || !call) return;
			if (x.ended) { endCall(x.removed ? 'أخرجك مضيف المكالمة منها' : 'انتهت المكالمة'); return; }
			(x.events || []).forEach(function (e) {
				if (e.kind === 'signal') onSignal(e.fromId, e.payload);
				else if (e.kind === 'joined' && e.card && e.card.id !== call.me.id && !e.card.guest) peer(e.card.id, e.card.name, true);   // a member who came after me: I offer
				else if (e.kind === 'left') drop(e.id);
				else if (e.kind === 'ended') endCall('انتهت المكالمة');
			});
		}).catch(function () { }).then(function () { if (call) call.timer = setTimeout(poll, 800); });
	}
	function joinCall() {
		if (!live || call) return;
		var btn = document.getElementById('cbJoin'); btn.disabled = true;
		var want = live.video;
		var gum = navigator.mediaDevices && navigator.mediaDevices.getUserMedia
			? navigator.mediaDevices.getUserMedia({ audio: true, video: want ? { height: { ideal: 480 }, facingMode: 'user' } : false }).catch(function () { return navigator.mediaDevices.getUserMedia({ audio: true, video: false }); })
			: Promise.reject(new Error('none'));
		gum.then(function (local) {
			return post('/api/guest/call/join', { callId: live.id }).then(function (r) {
				btn.disabled = false;
				if (!r || !r.ok) {
					local.getTracks().forEach(function (t) { t.stop(); });
					var why = { removed: 'أخرجك مضيف المكالمة منها', full: 'المكالمة ممتلئة', recording: 'هذه المكالمة تُسجَّل، فلا يدخلها ضيف', server: 'لا يدخل الضيف هذه المكالمة', gone: 'انتهت المكالمة' };
					alertLine((r && why[r.error]) || 'تعذّر الانضمام إلى المكالمة'); return;
				}
				call = { id: r.callId, me: r.me, local: local, peers: {}, mic: true, cam: local.getVideoTracks().length > 0, ice: (r.ice || []).map(function (u) { return { urls: u }; }) };
				var mine = document.getElementById('mine'); mine.srcObject = local; mine.hidden = !call.cam;
				document.getElementById('cmCam').hidden = !call.cam;
				stage.hidden = false; callBar.hidden = true; document.body.classList.add('incall');
				(r.members || []).forEach(function (m) { peer(m.id, m.name, true); });   // I am the one who joins: I offer to each
				paintCtl(); poll();
			});
		}).catch(function () { btn.disabled = false; alertLine('لا يمكن الوصول إلى الميكروفون — اسمح للمتصفح باستخدامه'); });
	}
	function endCall(note) {
		if (!call) return;
		var c = call; call = null; clearTimeout(c.timer);
		Object.keys(c.peers).forEach(function (id) { var p = c.peers[id]; try { p.pc.close(); } catch (e) { } });
		document.getElementById('tiles').innerHTML = '';
		c.local.getTracks().forEach(function (t) { t.stop(); });
		stage.hidden = true; document.body.classList.remove('incall');
		if (note) alertLine(note);
		showLive(null);
	}
	function leaveCall() { if (!call) return; post('/api/guest/call/leave', { callId: call.id }); endCall('غادرتَ المكالمة'); }
	function paintCtl() {
		var m = document.getElementById('cmMic'), c = document.getElementById('cmCam');
		m.textContent = call.mic ? 'كتم الصوت' : 'إلغاء الكتم'; m.classList.toggle('off', !call.mic);
		c.textContent = call.cam ? 'إيقاف الكاميرا' : 'تشغيل الكاميرا'; c.classList.toggle('off', !call.cam);
	}
	document.getElementById('cbJoin').addEventListener('click', joinCall);
	document.getElementById('cmLeave').addEventListener('click', leaveCall);
	document.getElementById('cmMic').addEventListener('click', function () { if (!call) return; call.mic = !call.mic; call.local.getAudioTracks().forEach(function (t) { t.enabled = call.mic; }); paintCtl(); sendState(); });
	document.getElementById('cmCam').addEventListener('click', function () { if (!call) return; call.cam = !call.cam; call.local.getVideoTracks().forEach(function (t) { t.enabled = call.cam; }); document.getElementById('mine').hidden = !call.cam; paintCtl(); sendState(); });
	window.addEventListener('pagehide', function () { if (call) { try { var fd = new FormData(); fd.append('callId', call.id); fetch('/api/guest/call/leave', { method: 'POST', headers: { 'X-Guest': key }, credentials: 'omit', body: fd, keepalive: true }); } catch (e) { } } });
	btn.addEventListener('click', send);
	box.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
	if (!/^\d+\.[A-Za-z0-9_-]{20,}$/.test(key)) gone(); else load();
})();
</script>
</body>
</html>
