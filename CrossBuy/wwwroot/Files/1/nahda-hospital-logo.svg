<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <!-- Al Nahda Hospital: flat brand blue, a heartbeat line (never a cross). The Cairo face is embedded
       (a subset of exactly these letters) so the mark looks the same in every browser, PDF and print. -->
  <style>
    @font-face { font-family: "NahdaCairo"; font-weight: 700; src: url(data:font/ttf;base64,) format("truetype"); }
    .ar { font-family: "NahdaCairo", Cairo, sans-serif; font-weight: 700; font-size: 41px; fill: #1F2D4D; }
    .en { font-family: "NahdaCairo", Cairo, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 3.4px; fill: #3A5795; }
  </style>
  <rect x="4" y="8" width="104" height="104" rx="24" fill="#3A5795"/>
  <path d="M18 64h20l9-20 13 40 11-30 6 10h21" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ar" x="472" y="64" text-anchor="end">مستشفى النهضة</text>
  <text class="en" x="472" y="100" text-anchor="end">AL NAHDA HOSPITAL</text>
</svg>
