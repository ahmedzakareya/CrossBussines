  <rect x="19" y="9" width="6.5" height="9" rx="2" fill="#ffffff" opacity="0.85"/>
  <rect x="8.5" y="20.5" width="17" height="3.4" rx="1.7" fill="#ffffff" opacity="0.7"/>
  <!-- wordmark -->
  <text x="40" y="23" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="19" font-weight="800" fill="#13433a">Cross<tspan fill="#d4a017">Buy</tspan></text>
